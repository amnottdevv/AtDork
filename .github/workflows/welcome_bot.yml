name: Welcome New Contributor

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Greet first-time contributor
        uses: actions/github-script@v7
        with:
          script: |
            const creator = context.payload.pull_request.user.login;
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const prNumber = context.payload.pull_request.number;

            // Check if this is the contributor's first PR to this repository
            const { data: prs } = await github.rest.pulls.list({
              owner: owner,
              repo: repo,
              author: creator,
              state: 'all',
            });

            if (prs.length === 1) {
              const message = `
          🎉 **Welcome to AtDork, @${creator}!**

          Thank you so much for taking the time to submit your first pull request.  
          We really appreciate your contribution to making AtDork better for everyone.

          **A few things to keep in mind while you wait for review:**

          - A maintainer will review your changes as soon as possible. Please be patient — we are a small team.
          - Make sure all **checks are passing** (linting, tests, security scan). You can see the status at the bottom of this PR.
          - If you haven't already, please read our [Contributing Guidelines](https://github.com/${owner}/${repo}/blob/master/CONTRIBUTING.md) and [Code of Conduct](https://github.com/${owner}/${repo}/blob/master/CODE_OF_CONDUCT.md).
          - Need help? Feel free to ask questions right here in the PR comments or open a [Discussion](https://github.com/${owner}/${repo}/discussions).

          Once again, thank you — and welcome to the community! 🚀
              `;

              await github.rest.issues.createComment({
                owner: owner,
                repo: repo,
                issue_number: prNumber,
                body: message.trim(),
              });
            }
