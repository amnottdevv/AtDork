[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atdork"
version = "1.3.9.5"
description = "dorking tools with ddgs metasearch OSINT tool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "alzzmarket", email = "alzzmarket@proton.me"}
]
keywords = ["osint", "dork", "pentest", "security", "duckduckgo", "metasearch", "ghdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
requires-python = ">=3.9"
dependencies = [
    "ddgs>=7.0",
    "rich>=13.0",
    "pyfiglet>=0.8",
    "pyyaml>=6.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
    "bandit>=1.7",
    "safety>=3.0",
]

[project.urls]
Homepage = "https://github.com/amnottdevv/atdork"
"Bug Reports" = "https://github.com/amnottdevv/atdork/issues"
"Source Code" = "https://github.com/amnottdevv/atdork"
"documentation" = "https://amnottdevv.github.io/AtDork/"

[tool.setuptools]
py-modules = ["atdork"]
packages = [
    "core",
    "core.case",
    "lib",
    "wordlists",
    "wordlists.templates",
    "database",
]

[tool.setuptools.package-data]
wordlists = ["*.txt"]
"wordlists.templates" = ["*.yaml", "*.yml"]
database = ["*.txt", "*.md"]

[project.scripts]
atdork = "atdork:main"
