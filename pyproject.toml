[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atdork"
version = "1.3.9.7"
description = "dorking tools with ddgs metasearch OSINT tool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "alzzmarket", email = "alzzmarket@proton.me"}
]
keywords = ["osint", "dork", "pentest", "security", "duckduckgo", "metasearch", "ghdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
requires-python = ">=3.9"
dependencies = [
    "ddgs>=7.0",
    "rich>=13.0",
    "pyfiglet>=0.8",
    "pyyaml>=6.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "urllib3>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
    "bandit>=1.7",
    "safety>=3.0",
]

[project.urls]
Homepage = "https://github.com/amnottdevv/atdork"
"Bug Reports" = "https://github.com/amnottdevv/atdork/issues"
"Source Code" = "https://github.com/amnottdevv/atdork"
"documentation" = "https://amnottdevv.github.io/AtDork/"

# ---------------------------------------------------------------------------
# Package discovery & data files
# ---------------------------------------------------------------------------
#

# Dork data lives in the separate Atdork-DB repository
# (github.com/amnottdevv/Atdork-DB), fetched through the built-in package
# manager: `atdork install c@cve_1.txt`. This distribution bundles only
# code plus the built-in wordlists/templates for --filter-vuln/--template.

[tool.setuptools]
py-modules = ["atdork"]
include-package-data = true

[tool.setuptools.packages.find]
# Auto-discover all Python packages (folders with __init__.py)
include = [
    "core*",
    "lib*",
    "wordlists*",
]
exclude = ["tests*", "docs*", "raw*", "assets*"]

[tool.setuptools.package-data]
# Wordlists: vulnerability signatures (flat directory)
wordlists = ["*.txt"]

# Templates: YAML dork collections
"wordlists.templates" = ["*.yaml", "*.yml"]

[project.scripts]
atdork = "atdork:main"
